<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="816" viewBox="0 0 1180 816" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Wiring: SATA power into each fan splitter's female end; the Arduino and the fans on its male legs</title>
  <defs>
    <symbol id="fan" viewBox="-20 -20 40 40">
      <circle r="18" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
      <g fill="#9ca3af">
        <ellipse rx="4" ry="12" transform="rotate(20) translate(0 -6)"/>
        <ellipse rx="4" ry="12" transform="rotate(140) translate(0 -6)"/>
        <ellipse rx="4" ry="12" transform="rotate(260) translate(0 -6)"/>
      </g>
      <circle r="4" fill="#4b5563"/>
    </symbol>
    <style>
      .box   { fill: #ffffff; stroke: #374151; stroke-width: 2; }
      .title { font-weight: 700; font-size: 15px; fill: #111827; }
      .sub   { fill: #4b5563; font-size: 12px; }
      .tiny  { fill: #6b7280; font-size: 11px; }
      .zone  { font-weight: 700; font-size: 13px; fill: #111827; }
      .pin   { fill: #ffffff; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
      .pinNC { fill: #9ca3af; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
      .pwm   { stroke: #2563eb; stroke-width: 3; fill: none; }
      .gnd   { stroke: #111827; stroke-width: 3; fill: none; }
      .tach  { stroke: #16a34a; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .v12   { stroke: #eab308; stroke-width: 4; fill: none; }
      .usb   { stroke: #6b7280; stroke-width: 4; fill: none; }
      .cable { stroke: #374151; stroke-width: 7; fill: none; stroke-linecap: round; }
      .leg   { stroke: #374151; stroke-width: 3; fill: none; }
      .conn  { fill: #1f2937; stroke: #111827; stroke-width: 1; }
      .zoom  { stroke: #cbd5e1; stroke-width: 1; fill: none; }
      .lens  { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .detail { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
      .splitter { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .warn path { fill: #fbbf24; stroke: #b45309; stroke-width: 1.5; stroke-linejoin: round; }
      .warn text { fill: #78350f; font-size: 12px; font-weight: 800; text-anchor: middle; }
      .fend  { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; }
      .mark circle { fill: #7c3aed; stroke: #ffffff; stroke-width: 2; }
      .mark text   { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="816" rx="14" fill="#ffffff"/>

  <!-- Host -->
  <rect class="box" x="60" y="30" width="200" height="70" rx="8"/>
  <text class="title" x="160" y="58" text-anchor="middle">Proxmox host</text>
  <text class="sub" x="160" y="78" text-anchor="middle">runs proxmox-fancontrol</text>
  <path class="usb" d="M160 100 V140"/>
  <text class="sub" x="170" y="125">USB (power + data)</text>

  <!-- Arduino -->
  <rect x="60" y="140" width="200" height="490" rx="8" fill="#0e7490" stroke="#155e75" stroke-width="2"/>
  <text x="80" y="170" font-weight="700" font-size="15" fill="#ffffff">Arduino Nano</text>
  <text x="80" y="188" font-size="12" fill="#cffafe">ATmega328P</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#ffffff" text-anchor="end">
    <text x="248" y="209">D2  tach</text><text x="248" y="229">D9  PWM</text>
    <text x="248" y="369">D3  tach</text><text x="248" y="389">D10 PWM</text>
    <text x="248" y="529">D4  tach</text><text x="248" y="549">D11 PWM</text>
    <text x="248" y="169">GND</text>
  </g>
  <g fill="#fbbf24" stroke="#78350f" stroke-width="1">
    <rect x="256" y="201" width="8" height="8"/><rect x="256" y="221" width="8" height="8"/>
    <rect x="256" y="361" width="8" height="8"/><rect x="256" y="381" width="8" height="8"/>
    <rect x="256" y="521" width="8" height="8"/><rect x="256" y="541" width="8" height="8"/>
    <rect x="256" y="161" width="8" height="8"/>
  </g>

  <!-- jumper wires -->
  <path class="tach" d="M264 205 H444"/><path class="pwm" d="M264 225 H444"/>
  <path class="tach" d="M264 365 H444"/><path class="pwm" d="M264 385 H444"/>
  <path class="tach" d="M264 525 H444"/><path class="pwm" d="M264 545 H444"/>
  <path class="gnd" d="M264 165 H444"/>

  <!-- enlarged-view panels behind each pin-out -->
  <rect class="detail" x="444" y="144" width="124" height="102" rx="6"/><rect class="detail" x="444" y="304" width="124" height="102" rx="6"/><rect class="detail" x="444" y="464" width="124" height="102" rx="6"/>

  <!-- jumper plugs on the splitter end, same as the Arduino end -->
  <g fill="#fbbf24" stroke="#78350f" stroke-width="1"><rect x="440" y="161" width="8" height="8"/><rect x="440" y="201" width="8" height="8"/><rect x="440" y="221" width="8" height="8"/><rect x="440" y="361" width="8" height="8"/><rect x="440" y="381" width="8" height="8"/><rect x="440" y="521" width="8" height="8"/><rect x="440" y="541" width="8" height="8"/></g>

  <!-- the Arduino's leg on each splitter -->
  <rect class="conn" x="450" y="150" width="112" height="90" rx="4"/>
  <rect class="conn" x="450" y="310" width="112" height="90" rx="4"/>
  <rect class="conn" x="450" y="470" width="112" height="90" rx="4"/>
  <g>
    <text class="pin" x="460" y="169">1 GND</text><text class="pinNC" x="460" y="189">2 12V  —</text>
    <text class="pin" x="460" y="209">3 TACH</text><text class="pin" x="460" y="229">4 PWM</text>
    <text class="pin" x="460" y="329">1 GND</text><text class="pinNC" x="460" y="349">2 12V  —</text>
    <text class="pin" x="460" y="369">3 TACH</text><text class="pin" x="460" y="389">4 PWM</text>
    <text class="pin" x="460" y="489">1 GND</text><text class="pinNC" x="460" y="509">2 12V  —</text>
    <text class="pin" x="460" y="529">3 TACH</text><text class="pin" x="460" y="549">4 PWM</text>
  </g>
  <text class="tiny" x="450" y="258">enlarged · 12 V pin left empty</text>
  <text class="tiny" x="450" y="418">enlarged · no GND wire needed</text>
  <text class="tiny" x="450" y="578">enlarged · no GND wire needed</text>

  <!-- one box per splitter; its own connectors sit on the right edge -->
  <rect class="splitter" x="608" y="140" width="164" height="112" rx="8"/><text class="zone" x="610" y="133">Z1 · Front: 1→3 splitter</text>
  <rect class="splitter" x="608" y="300" width="164" height="104" rx="8"/><text class="zone" x="610" y="293">Z2 · Top: 1→2 splitter</text>
  <rect class="splitter" x="608" y="460" width="164" height="104" rx="8"/><text class="zone" x="610" y="453">Z3 · Rear: 1→2 splitter</text>

  <!-- splitter bodies: legs meet at a junction; the single (female) end goes up to the SATA plug -->
  <circle class="lens" cx="641" cy="195" r="21"/><path class="zoom" d="M568 144 L641 174 M568 246 L641 216"/><path class="leg" d="M656 195 H668"/><rect class="conn" x="626" y="185" width="30" height="20" rx="3"/><text x="641" y="199" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><rect x="536" y="156" width="20" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/><text x="546" y="169" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><circle cx="668" cy="195" r="6" fill="#374151"/>
  <path class="cable" d="M668 195 L740 155"/>
  <path class="leg" d="M668 195 H740 M668 195 L740 235"/>

  <circle class="lens" cx="641" cy="355" r="21"/><path class="zoom" d="M568 304 L641 334 M568 406 L641 376"/><path class="leg" d="M656 355 H668"/><rect class="conn" x="626" y="345" width="30" height="20" rx="3"/><text x="641" y="359" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><rect x="536" y="316" width="20" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/><text x="546" y="329" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><circle cx="668" cy="355" r="6" fill="#374151"/>
  <path class="cable" d="M668 355 L740 315"/>
  <path class="leg" d="M668 355 L740 385"/>

  <circle class="lens" cx="641" cy="515" r="21"/><path class="zoom" d="M568 464 L641 494 M568 566 L641 536"/><path class="leg" d="M656 515 H668"/><rect class="conn" x="626" y="505" width="30" height="20" rx="3"/><text x="641" y="519" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><rect x="536" y="476" width="20" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/><text x="546" y="489" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><circle cx="668" cy="515" r="6" fill="#374151"/>
  <path class="cable" d="M668 515 L740 475"/>
  <path class="leg" d="M668 515 L740 545"/>

  <!-- each connection shows both halves, same size: F = female (white), M = male (dark) -->
  <rect class="fend" x="740" y="145" width="30" height="20" rx="3"/><text x="755" y="159" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text><rect class="conn" x="774" y="145" width="30" height="20" rx="3"/><text x="789" y="159" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text>
  <rect class="fend" x="740" y="305" width="30" height="20" rx="3"/><text x="755" y="319" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text><rect class="conn" x="774" y="305" width="30" height="20" rx="3"/><text x="789" y="319" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text>
  <rect class="fend" x="740" y="465" width="30" height="20" rx="3"/><text x="755" y="479" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text><rect class="conn" x="774" y="465" width="30" height="20" rx="3"/><text x="789" y="479" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text>
  <rect class="conn" x="740" y="185" width="30" height="20" rx="3"/><text x="755" y="199" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><rect class="fend" x="774" y="185" width="30" height="20" rx="3"/><text x="789" y="199" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text>
  <rect class="conn" x="740" y="225" width="30" height="20" rx="3"/><text x="755" y="239" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><rect class="fend" x="774" y="225" width="30" height="20" rx="3"/><text x="789" y="239" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text>
  <rect class="conn" x="740" y="375" width="30" height="20" rx="3"/><text x="755" y="389" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><rect class="fend" x="774" y="375" width="30" height="20" rx="3"/><text x="789" y="389" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text>
  <rect class="conn" x="740" y="535" width="30" height="20" rx="3"/><text x="755" y="549" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><rect class="fend" x="774" y="535" width="30" height="20" rx="3"/><text x="789" y="549" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text>

  <!-- fan power: SATA → 3 power-only fan plugs, one into each splitter's female end -->
  <rect class="box" x="790" y="30" width="250" height="70" rx="8"/>
  <text class="title" x="915" y="56" text-anchor="middle">PSU · SATA power</text>
  <text class="sub" x="915" y="76" text-anchor="middle">SATA → 3 fan plugs (12 V + GND only)</text>
  <path class="v12" d="M850 100 V475"/>
  <path class="v12" d="M804 155 H850 M804 315 H850 M804 475 H850"/>
  <circle cx="850" cy="155" r="5" fill="#eab308"/><circle cx="850" cy="315" r="5" fill="#eab308"/>

  <!-- fans -->
  <path class="leg" d="M804 195 H900 M804 235 H900"/>
  <use href="#fan" x="900" y="175" width="40" height="40"/><use href="#fan" x="900" y="215" width="40" height="40"/>
  <text class="zone" x="955" y="200">Front fans</text>
  <text class="sub" x="955" y="218">intake</text>

  <path class="leg" d="M804 385 H900"/>
  <use href="#fan" x="900" y="365" width="40" height="40"/>
  <path class="leg" d="M940 385 H980" stroke-dasharray="4 3"/>
  <use href="#fan" x="980" y="365" width="40" height="40"/>
  <text class="zone" x="1032" y="372">Top fans</text>
  <text class="sub" x="1032" y="390">exhaust</text>

  <path class="leg" d="M804 545 H900"/>
  <use href="#fan" x="900" y="525" width="40" height="40"/>
  <text class="zone" x="955" y="542">Rear fan</text>
  <text class="sub" x="955" y="560">exhaust</text>


  <!-- footnote markers: numbers match the notes at the bottom -->
  <g class="mark"><circle cx="789" cy="132" r="9"/><text x="789" y="136">1</text></g>
  <g class="mark"><circle cx="789" cy="292" r="9"/><text x="789" y="296">1</text></g>
  <g class="mark"><circle cx="789" cy="452" r="9"/><text x="789" y="456">1</text></g>
  <g class="mark"><circle cx="354" cy="165" r="9"/><text x="354" y="169">2</text></g>
  <g class="warn"><path d="M354 195 L365 213 L343 213 Z"/><text x="354" y="211">!</text></g>
  <g class="warn"><path d="M354 355 L365 373 L343 373 Z"/><text x="354" y="371">!</text></g>
  <g class="warn"><path d="M354 515 L365 533 L343 533 Z"/><text x="354" y="531">!</text></g>
  <g class="mark"><circle cx="958" cy="238" r="9"/><text x="958" y="242">3</text></g>
  <g class="mark"><circle cx="960" cy="368" r="9"/><text x="960" y="372">3</text></g>

  <!-- Legend -->
  <g transform="translate(60 668)">
    <path class="pwm" d="M0 0 H34"/><text x="44" y="4">PWM (required)</text>
    <path class="gnd" d="M170 0 H204"/><text x="214" y="4">GND (required)</text>
    <path class="tach" d="M340 0 H374"/><text x="384" y="4">Tach / RPM (optional)</text>
    <path class="leg" d="M560 0 H594" stroke-dasharray="4 3"/><text x="604" y="4">Daisy chain: fan pass-through lead</text>
    <path class="v12" d="M0 26 H34"/><text x="44" y="30">12 V + GND fan power: never to the Arduino</text>
    <rect class="fend" x="340" y="16" width="30" height="20" rx="3"/><text x="355" y="30" fill="#1f2937" font-size="11" font-weight="700" text-anchor="middle">F</text><rect class="conn" x="374" y="16" width="30" height="20" rx="3"/><text x="389" y="30" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text><text x="414" y="30">4-pin PWM fan connector F / M (Molex KK, 2.54 mm)</text>
    <rect x="760" y="22" width="8" height="8" fill="#fbbf24" stroke="#78350f" stroke-width="1"/><path class="leg" d="M768 26 H794"/><text x="804" y="30">Dupont jumper, female–female</text>
  </g>
  <g class="mark"><circle cx="69" cy="728" r="9"/><text x="69" y="732">1</text></g><text class="sub" x="86" y="732">The SATA power plug goes in each splitter's single female end; the Arduino and the fans go on its male legs.</text>
  <g class="mark"><circle cx="69" cy="748" r="9"/><text x="69" y="752">2</text></g><text class="sub" x="86" y="752">All connectors on a splitter share GND, 12 V and PWM, and the SATA lead joins every splitter's ground at the PSU, so one Arduino GND wire grounds all three zones.</text>
  <g class="mark"><circle cx="69" cy="768" r="9"/><text x="69" y="772">3</text></g><text class="sub" x="86" y="772">More fans in a zone: use a 1→3 / 1→4 splitter, or daisy-chain fans that have a pass-through connector.</text>
  <g class="warn"><path d="M69 779 L80 797 L58 797 Z"/><text x="69" y="795">!</text></g><text class="sub" x="86" y="792"><tspan font-weight="700" fill="#92400e">RPM may not work as drawn:</tspan> tach only reaches the Arduino if both of their splitter legs carry pin 3, and many splitters wire it on one leg only. Fan control is unaffected.</text>
</svg>
