<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Wiring: Proxmox host, Arduino Nano, PWM fan hubs and fans</title>
  <defs>
    <symbol id="fan" viewBox="-20 -20 40 40">
      <circle r="18" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
      <g fill="#9ca3af">
        <ellipse rx="4" ry="12" transform="rotate(20) translate(0 -6)"/>
        <ellipse rx="4" ry="12" transform="rotate(140) translate(0 -6)"/>
        <ellipse rx="4" ry="12" transform="rotate(260) translate(0 -6)"/>
      </g>
      <circle r="4" fill="#4b5563"/>
    </symbol>
    <style>
      .box   { fill: #ffffff; stroke: #374151; stroke-width: 2; }
      .title { font-weight: 700; font-size: 15px; fill: #111827; }
      .sub   { fill: #4b5563; font-size: 12px; }
      .pin   { fill: #111827; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
      .pinNC { fill: #9ca3af; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
      .pwm   { stroke: #2563eb; stroke-width: 3; fill: none; }
      .gnd   { stroke: #111827; stroke-width: 3; fill: none; }
      .tach  { stroke: #16a34a; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .v12   { stroke: #eab308; stroke-width: 4; fill: none; }
      .usb   { stroke: #6b7280; stroke-width: 4; fill: none; }
      .lead  { stroke: #6b7280; stroke-width: 2; fill: none; }
      .zone  { font-weight: 700; font-size: 13px; fill: #111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="700" rx="14" fill="#ffffff"/>

  <!-- Host -->
  <rect class="box" x="60" y="30" width="200" height="70" rx="8"/>
  <text class="title" x="160" y="58" text-anchor="middle">Proxmox host</text>
  <text class="sub" x="160" y="78" text-anchor="middle">Dell OptiPlex SFF · fancontrold</text>
  <path class="usb" d="M160 100 V150"/>
  <text class="sub" x="170" y="130">USB (power + data)</text>

  <!-- Arduino -->
  <rect x="60" y="150" width="200" height="430" rx="8" fill="#0e7490" stroke="#155e75" stroke-width="2"/>
  <text x="80" y="180" font-weight="700" font-size="15" fill="#ffffff">Arduino Nano</text>
  <text x="80" y="198" font-size="12" fill="#cffafe">ATmega328P</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#ffffff" text-anchor="end">
    <text x="248" y="224">D2  tach</text><text x="248" y="244">D9  PWM</text>
    <text x="248" y="364">D3  tach</text><text x="248" y="384">D10 PWM</text>
    <text x="248" y="504">D4  tach</text><text x="248" y="524">D11 PWM</text>
    <text x="248" y="564">GND</text>
  </g>
  <g fill="#fbbf24" stroke="#78350f" stroke-width="1">
    <rect x="256" y="216" width="8" height="8"/><rect x="256" y="236" width="8" height="8"/>
    <rect x="256" y="356" width="8" height="8"/><rect x="256" y="376" width="8" height="8"/>
    <rect x="256" y="496" width="8" height="8"/><rect x="256" y="516" width="8" height="8"/>
    <rect x="256" y="556" width="8" height="8"/>
  </g>

  <!-- jumper wires: tach (optional), PWM, GND bus -->
  <path class="tach" d="M264 220 H514"/><path class="pwm" d="M264 240 H514"/>
  <path class="tach" d="M264 360 H514"/><path class="pwm" d="M264 380 H514"/>
  <path class="tach" d="M264 500 H514"/><path class="pwm" d="M264 520 H514"/>
  <path class="gnd" d="M264 560 H470 V180 H514 M470 320 H514 M470 460 H514"/>
  <circle cx="470" cy="320" r="5" fill="#111827"/><circle cx="470" cy="460" r="5" fill="#111827"/>
  <text class="sub" x="300" y="300">jumper wires</text>
  <text class="sub" x="300" y="316">(Dupont / patch leads)</text>

  <!-- PSU + 12 V -->
  <rect class="box" x="520" y="30" width="200" height="70" rx="8"/>
  <text class="title" x="620" y="58" text-anchor="middle">PSU</text>
  <text class="sub" x="620" y="78" text-anchor="middle">SATA power → splitter</text>
  <path class="v12" d="M720 65 H760 V415"/>
  <path class="v12" d="M760 135 H700 V150 M760 275 H700 V290 M760 415 H700 V430"/>
  <circle cx="760" cy="135" r="5" fill="#eab308"/><circle cx="760" cy="275" r="5" fill="#eab308"/>
  <text class="sub" x="770" y="100">12 V via SATA</text>

  <!-- Hubs -->
  <g id="hubs">
    <!-- Z1 -->
    <text class="zone" x="520" y="142">Z1 · Front: PWM fan hub</text>
    <rect class="box" x="520" y="150" width="200" height="110" rx="8"/>
    <!-- Z2 -->
    <text class="zone" x="520" y="282">Z2 · Top: PWM fan hub</text>
    <rect class="box" x="520" y="290" width="200" height="110" rx="8"/>
    <!-- Z3 -->
    <text class="zone" x="520" y="422">Z3 · Rear: PWM fan hub</text>
    <rect class="box" x="520" y="430" width="200" height="110" rx="8"/>
  </g>
  <!-- hub input-lead pins -->
  <g>
    <g transform="translate(0 0)">
      <rect x="512" y="176" width="10" height="8" fill="#111827"/><rect x="512" y="196" width="10" height="8" fill="#e5e7eb" stroke="#9ca3af"/>
      <rect x="512" y="216" width="10" height="8" fill="#16a34a"/><rect x="512" y="236" width="10" height="8" fill="#2563eb"/>
      <text class="pin" x="532" y="184">1 GND</text><text class="pinNC" x="532" y="204">2 12V (not connected)</text>
      <text class="pin" x="532" y="224">3 TACH</text><text class="pin" x="532" y="244">4 PWM</text>
    </g>
    <g transform="translate(0 140)">
      <rect x="512" y="176" width="10" height="8" fill="#111827"/><rect x="512" y="196" width="10" height="8" fill="#e5e7eb" stroke="#9ca3af"/>
      <rect x="512" y="216" width="10" height="8" fill="#16a34a"/><rect x="512" y="236" width="10" height="8" fill="#2563eb"/>
      <text class="pin" x="532" y="184">1 GND</text><text class="pinNC" x="532" y="204">2 12V (not connected)</text>
      <text class="pin" x="532" y="224">3 TACH</text><text class="pin" x="532" y="244">4 PWM</text>
    </g>
    <g transform="translate(0 280)">
      <rect x="512" y="176" width="10" height="8" fill="#111827"/><rect x="512" y="196" width="10" height="8" fill="#e5e7eb" stroke="#9ca3af"/>
      <rect x="512" y="216" width="10" height="8" fill="#16a34a"/><rect x="512" y="236" width="10" height="8" fill="#2563eb"/>
      <text class="pin" x="532" y="184">1 GND</text><text class="pin" x="532" y="204" fill="#9ca3af" style="fill:#9ca3af">2 12V (not connected)</text>
      <text class="pin" x="532" y="224">3 TACH</text><text class="pin" x="532" y="244">4 PWM</text>
    </g>
  </g>

  <!-- Fans -->
  <path class="lead" d="M720 185 H830 M720 225 H830"/>
  <use href="#fan" x="830" y="165" width="40" height="40"/><use href="#fan" x="830" y="205" width="40" height="40"/>
  <text class="zone" x="884" y="200">Front fans</text>
  <text class="sub" x="884" y="218">intake over the drive stack</text>
  <text class="sub" x="884" y="234">(5 × WD Red, ZFS pool)</text>

  <path class="lead" d="M720 325 H830 M720 365 H830"/>
  <use href="#fan" x="830" y="305" width="40" height="40"/><use href="#fan" x="830" y="345" width="40" height="40"/>
  <text class="zone" x="884" y="340">Top fans</text>
  <text class="sub" x="884" y="358">exhaust: CPU + disk heat</text>

  <path class="lead" d="M720 485 H830"/>
  <use href="#fan" x="830" y="465" width="40" height="40"/>
  <text class="zone" x="884" y="480">Rear fan</text>
  <text class="sub" x="884" y="498">exhaust</text>

  <!-- Legend -->
  <g transform="translate(60 615)">
    <path class="pwm" d="M0 0 H34"/><text x="44" y="4">PWM (required)</text>
    <path class="gnd" d="M170 0 H204"/><text x="214" y="4">GND, shared (required)</text>
    <path class="tach" d="M390 0 H424"/><text x="434" y="4">Tach / RPM (optional)</text>
    <path class="v12" d="M600 0 H634"/><text x="644" y="4">12 V fan power: never to the Arduino</text>
  </g>
  <text class="sub" x="60" y="660">Two wires per zone (PWM + GND), three with tach. Hub input-lead pin 2 (12 V) stays unconnected: the hubs take fan power from SATA.</text>
  <text class="sub" x="60" y="678">Several fans in a zone share one input: plug them into the zone's hub, or daisy-chain fans that have a pass-through connector. Fan counts are examples.</text>
</svg>
