name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # needed to attach the firmware to releases

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Proxmox VE 8 ships Python 3.11
      - name: Python compiles
        run: python -m py_compile fancontrold/fancontrold.py
      - name: Shell scripts parse
        run: bash -n install.sh && bash -n flash.sh
      - name: ShellCheck
        run: shellcheck -S warning install.sh flash.sh
      - name: Daemon starts in simulation mode
        run: |
          python fancontrold/fancontrold.py --simulate --port 18090 &
          for i in $(seq 1 20); do curl -fs localhost:18090/api/status >/dev/null && break; sleep 0.5; done
          curl -fs localhost:18090/api/status | python -c 'import json,sys; s=json.load(sys.stdin); assert len(s["zones"]) == 3, s'
          curl -fs localhost:18090/ | grep -q "<title>Fan Control</title>"
          kill %1

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile for Arduino Nano
        run: |
          arduino-cli compile --fqbn arduino:avr:nano --warnings default --output-dir build arduino/fan_zone_control
          cp build/fan_zone_control.ino.hex fan_zone_control.hex
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: fan_zone_control.hex
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fan_zone_control.hex
          generate_release_notes: true
